<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Costa del Gzowo UI test</title>
<link rel="icon" href="data:,">
<style>
html, body { margin: 0; height: 100%; background: #0b0d0c; overflow: hidden; }
body { background: url("bg.png") center / cover no-repeat #0b0d0c; }
</style>
</head>
<body>
<script type="module">
import { createScreens } from '../../src/ui/screens.js';
import { SPAWN } from '../../src/config.js';

const log = (name) => (...args) => console.log(`[callback] ${name}`, ...args);

const screens = createScreens({
  title: 'Costa del Gzowo',
  cssHref: '../../src/ui/screens.css',
  quality: 'ultra',
  volume: 0.8,
  musicVolume: 0.6,
  onGesture() {
    log('onGesture')();
    screens.setTrack({ title: 'Love Is a Long Road', artist: 'Tom Petty and the Heartbreakers' });
  },
  onStart: log('onStart'),
  onResume: log('onResume'),
  onResetCar: log('onResetCar'),
  onQuality: log('onQuality'),
  onVolume: log('onVolume'),
  onMusicVolume: log('onMusicVolume'),
  onMenuClose: log('onMenuClose'),
});

window.__ui = screens;
window.__feed = (data = {
  player: { x: SPAWN.player.x, z: SPAWN.player.z, yaw: SPAWN.player.yaw },
  car: { x: SPAWN.car.x, z: SPAWN.car.z, yaw: SPAWN.car.yaw },
}) => screens.setMap(data);

const t0 = performance.now();
const phases = [
  [0.0, 'Reading the river'],
  [0.3, 'Growing trees'],
  [0.6, 'Laying the road'],
  [0.9, 'Setting the sun'],
];
const timer = setInterval(() => {
  const p = Math.min(1, (performance.now() - t0) / 1500);
  const text = [...phases].reverse().find(([at]) => p >= at)[1];
  screens.setProgress(p, text);
  if (p >= 1) {
    clearInterval(timer);
    screens.ready();
  }
}, 60);

window.__ready = true;
</script>
</body>
</html>
