<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riverside</title>
<link rel="stylesheet" href="src/ui/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.19.3/rapier.mjs"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" hidden>
  <div id="prompt"></div>
  <div id="cluster">
    <div id="speed"><span id="speed-value">0</span><small>km/h</small></div>
    <div id="gear">P</div>
    <div id="rpm"><i id="rpm-bar"></i></div>
  </div>
  <div id="damage-note"></div>
  <div id="place">Sawgrass River Bridge</div>
</div>
<div id="boot">
  <div id="boot-inner">
    <h1>Riverside</h1>
    <p id="boot-status">Loading</p>
    <div id="boot-bar"><i id="boot-fill"></i></div>
    <button id="boot-go" hidden>Start</button>
    <div id="boot-keys">
      <span><b>WASD</b> move / drive</span>
      <span><b>Mouse</b> camera</span>
      <span><b>Shift</b> run</span>
      <span><b>Space</b> jump / handbrake</span>
      <span><b>F</b> enter / exit car</span>
      <span><b>C</b> camera</span>
      <span><b>R</b> reset car</span>
      <span><b>H</b> lights</span>
      <span><b>Esc</b> settings</span>
    </div>
  </div>
</div>
<div id="menu" hidden>
  <div id="menu-inner">
    <h2>Settings</h2>
    <label>Quality<select id="opt-quality"><option value="ultra">Ultra</option><option value="high">High</option><option value="medium">Medium</option></select></label>
    <label>Volume<input id="opt-volume" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    <button id="menu-resume">Resume</button>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
